<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Todo List</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

<div class="container p-10 w-100">

    <div class="row justify-content-center">
        <div class="col-lg-10">

            <div class="card shadow-lg border-0 rounded-4">

                <div class="card-header bg-primary text-white text-center rounded-top-2">
                    <h1 class="mb-10">Ruslan's Todo List</h1>
                </div>

                <div class="card-body">

                    <form action="/add" method="POST" class="d-flex gap-2 mb-4">
                        <input
                            type="text"
                            name="task"
                            class="form-control"
                            placeholder="Enter a new task..."
                            required
                        >

                        <button type="submit" class="btn btn-success">
                            Add
                        </button>
                    </form>

                    {% if todos %}

                        <ul class="list-group">

                            {% for todo in todos %}

                            <li class="list-group-item d-flex justify-content-between align-items-center">

                                <span class="{% if todo.done %}done{% endif %}">
                                    {{ todo.task }}
                                </span>

                                <div>

                                    <a href="/done/{{ loop.index0 }}"
                                       class="btn btn-sm btn-outline-success">
                                        ✔
                                    </a>

                                    <a href="/delete/{{ loop.index0 }}"
                                       class="btn btn-sm btn-outline-danger">
                                        🗑
                                    </a>

                                </div>

                            </li>

                            {% endfor %}

                        </ul>

                    {% else %}

                        <div class="alert alert-info text-center">
                            No tasks yet. Add your first task!
                        </div>

                    {% endif %}

                </div>

            </div>

        </div>
    </div>

</div>

</body>
</html>
