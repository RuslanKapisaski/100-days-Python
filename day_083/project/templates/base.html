<!DOCTYPE html>
<html lang="en" :class="{ 'dark': dark }">
<head>
    <meta charset="UTF-8">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
          content="Eliott — Freelance UI/UX Designer and Frontend Developer. Fast, clean and accessible digital products.">
    <meta name="keywords" content="freelance developer, UI designer, portfolio, Tailwind CSS, Alpine.js">
    <meta name="author" content="Eliott">
    <meta property="og:title" content="Eliott — Freelance UI/UX Designer">
    <meta property="og:description" content="I design and build digital products that people love to use.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://eliott.dev">
    <title>Ruslan Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=PT+Sans:ital,wght@0,400;0,700;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="../static/styles/style.css">
    <script>
        tailwind.config = {
          darkMode: 'class',
          theme: {
            extend: {
              fontFamily: { display: ['PT Sans','sans-serif'], body: ['DM Sans','sans-serif'] },
              colors: { accent: '#FF6B2B', 'accent-light': '#FF8F5C' }
            }
          }
        }
    </script>
</head>

<body x-data="app()" x-init="init()" :class="{ 'dark': dark }">

{% include "header.html" %}
{% block content%} {% endblock %}
{% include "footer.html" %}

<script>
    function app() {
      return {
        dark: false,
        mm: false,
        sc: false,
        s: 'hero',

        init() {
          // dark mode
          this.dark = localStorage.getItem('theme') === 'dark' ||
            (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          this.$watch('dark', v => localStorage.setItem('theme', v ? 'dark' : 'light'));

          // scroll
          window.addEventListener('scroll', () => {
            this.sc = window.scrollY > 20;
            this.updateSection();
          }, { passive: true });

          // reveal
          const io = new IntersectionObserver(entries => {
            entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
          }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });
          document.querySelectorAll('.reveal').forEach(el => io.observe(el));

          // year
          document.getElementById('yr').textContent = new Date().getFullYear();
        },

        updateSection() {
          const atBottom = (window.innerHeight + window.scrollY) >= document.body.scrollHeight - 60;
          if (atBottom) { this.s = 'contact'; return; }
          const ids = ['contact','blog','reviews','about','work','services','hero'];
          for (const id of ids) {
            const el = document.getElementById(id);
            if (el && window.scrollY >= el.offsetTop - 130) { this.s = id; return; }
          }
        }
      }
    }
</script>

</body>
</html>
